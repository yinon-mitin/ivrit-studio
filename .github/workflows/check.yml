name: check

# Checks only. Deployment stays "GitHub Pages: deploy from branch main / (root)" with no build.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit

      - name: Floor guard
        run: node scripts/floor-guard.mjs --base "${{ github.event.pull_request.base.sha || github.event.before }}"
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'

      - name: Secrets (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --config /repo/.gitleaks.toml

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Changed-line coverage
        if: github.event_name == 'pull_request'
        run: npm run coverage:diff

      - name: E2E (chromium + webkit, one-screen, axe, weight, no external requests)
        run: npx playwright test --pass-with-no-tests

      - name: Semgrep
        run: npm run sast

      - name: Dependency vulnerabilities
        run: docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.7.0 scan source -L /src/package-lock.json
