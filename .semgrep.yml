rules:
  - id: no-html-sinks
    languages: [javascript]
    severity: ERROR
    message: >-
      HTML sinks are banned (CONSTRAINTS.md, Security). Search input is
      user-supplied; build DOM with createElement/textContent instead.
    paths:
      include:
        - "assets/js/**"
    pattern-either:
      - pattern: $X.innerHTML = $Y
      - pattern: $X.outerHTML = $Y
      - pattern: $X.insertAdjacentHTML(...)
      - pattern: $X.setHTMLUnsafe(...)
      - pattern: document.write(...)
      - pattern: document.writeln(...)
      - pattern: eval(...)
      - pattern: new Function(...)
